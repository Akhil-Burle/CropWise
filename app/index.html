<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="CropWise – crop advice for Indian farmers" />
    <meta property="og:description" content="Read your Soil Health Card, check a sick leaf and get safe chemical and organic advice in your language." />
    <meta property="og:type" content="website" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F4D33" />
    <meta
      name="description"
      content="CropWise – soil health card reading, leaf disease diagnosis and a balanced chemical vs organic advisory for Indian farmers."
    />
    <title>CropWise – Pesticide Advisory & Organic Transition</title>
    <script>
      // Apply saved theme before paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem('cropwise-prefs') || '{}');
        var s = p.state || {};
        var dark = s.theme === 'dark' || (s.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        if (s.textSize) document.documentElement.dataset.textSize = s.textSize;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>CropWise needs JavaScript. Please enable it in your browser.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
